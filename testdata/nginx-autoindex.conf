# Serves the dummy DB in the same nginx-autoindex format the real Assetnote CDN
# uses, so server/download.go's fetchRemoteDBDate regex
#   hyoketsu\.db</a>\s+(\d{2}-\w{3}-\d{4})
# matches the directory listing at "/".
#
# CRITICAL: the nginx:alpine image ships a default index.html in the web root.
# With the default `index index.html;`, a request for "/" serves that welcome
# page and autoindex NEVER runs, so fetchRemoteDBDate can't find the date and the
# auto-update loop stalls in its 5-minute error backoff (=> /stats stays "{}").
# Overriding `index` to a file that does not exist forces nginx to fall through
# to the autoindex listing even though index.html is present in the directory.
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index __force_autoindex__;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime off;
    }
}
