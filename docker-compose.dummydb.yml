services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Native client avoids HTTP proxy configurations completely.
      # CMD-SHELL (not CMD) because podman's docker-compose provider word-splits
      # array elements on whitespace, turning "SELECT 1" into two bad CLI args.
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Serves the dummy DB via Nginx
  dummydb:
    image: nginx:alpine
    volumes:
      - ./testdata/hyoketsu.db:/usr/share/nginx/html/hyoketsu.db:ro
      - ./testdata/nginx-autoindex.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Hyoketsu Remote Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      dummydb:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      HYOKETSU_INDEX_URL: "http://dummydb/"
      HYOKETSU_DB_URL: "http://dummydb/hyoketsu.db"
    command:
      - "-clickhouse=clickhouse://clickhouse:9000/default"
      - "-auto-update"
      - "-auto-update-interval=1m"
      - "-db-cache=/data/hyoketsu.db"
    restart: unless-stopped

volumes:
  clickhouse_data: